# Имя проекта задано явно: иначе docker compose не стартует из папки
# с русским названием (он выводит имя из имени каталога).
name: zakupki

services:
  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/purchases.db
      MEDIA_DIR: /data/media
      PANEL_HOST: 0.0.0.0
      PANEL_PORT: 8080
      # Шаги незаполненных заявок переживают перезапуск:
      # REDIS_URL: redis://redis:6379/0
    ports:
      # По умолчанию порт виден только самому серверу: панель показывает nginx.
      # Чтобы открыть её напрямую по IP (без домена), пропишите в .env:
      #   PANEL_BIND=0.0.0.0
      - "${PANEL_BIND:-127.0.0.1}:8080:8080"
    volumes:
      # Папка должна принадлежать пользователю с uid 1000 — им работает контейнер:
      #   mkdir -p data && sudo chown -R 1000:1000 data
      - ./data:/data
    restart: unless-stopped

  # Нужен, только если включили REDIS_URL выше.
