<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Склад</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/portal.css">
  <link rel="stylesheet" href="/static/stock.css">
  <script>
    try {
      var saved = localStorage.getItem('pb_theme');
      if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
    } catch (e) {}
  </script>
</head>
<body>

<section id="login-screen" class="login-screen" hidden>
  <form class="login-card" id="login-form">
    <h1>Склад</h1>
    <p class="muted">Введите логин и пароль.</p>
    <label>Логин <input type="text" id="login" autocomplete="username" required></label>
    <label>Пароль <input type="password" id="password" autocomplete="current-password" required></label>
    <button type="submit" class="btn btn-primary btn-block">Войти</button>
    <p class="form-error" id="login-error" hidden></p>
  </form>
</section>

<div id="app" class="app" hidden>
  <header class="stock-bar">
    <div class="stock-bar-top">
      <a class="portal-brand" href="/">Портал</a>
      <span class="crumb">/</span>
      <select id="warehouse" class="wh-select" aria-label="Склад"></select>
      <span class="spacer"></span>
      <label class="who">
        <span class="who-label">Работает</span>
        <select id="actor"></select>
      </label>
      <button class="btn btn-quiet icon-only" id="add-employee" title="Добавить сотрудника">+</button>
      <span class="user" id="user-chip"></span>
      <button class="btn btn-quiet" id="logout-btn">Выйти</button>
    </div>
    <nav class="stock-nav" id="stock-nav"></nav>
  </header>

  <main class="content stock-content" id="view"></main>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="modal modal-narrow" role="dialog" aria-modal="true">
    <header class="modal-head">
      <h2 id="modal-title"></h2>
      <button class="icon-btn" id="modal-close" title="Закрыть (Esc)">&times;</button>
    </header>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div class="scan-overlay" id="scan-overlay" hidden>
  <div class="scan-sheet">
    <div class="scan-sheet-head">
      <strong id="scan-overlay-title">Сканируйте QR</strong>
      <button class="icon-btn" id="scan-overlay-close">&times;</button>
    </div>
    <div id="scan-overlay-body"></div>
  </div>
</div>

<aside class="drawer" id="drawer" hidden aria-label="Карточка сотрудника">
  <div class="drawer-sheet">
    <header class="drawer-head">
      <strong id="drawer-title">Сотрудник</strong>
      <button class="icon-btn" id="drawer-close" title="Закрыть">&times;</button>
    </header>
    <div class="drawer-body" id="drawer-body"></div>
  </div>
</aside>

<div class="toast" id="toast" hidden></div>

<script src="/static/vendor/jsQR.js"></script>
<script src="/static/stock.js"></script>
</body>
</html>
