<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Заявки на закупку</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script>
    // Ставим тему до первой отрисовки, иначе при загрузке мигает чужой фон.
    try {
      var saved = localStorage.getItem('pb_theme');
      if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
    } catch (e) { /* приватный режим — остаётся системная тема */ }
  </script>
</head>
<body>

<!-- ВХОД -->
<section id="login-screen" class="login-screen" hidden>
  <form class="login-card" id="login-form">
    <h1>Заявки на закупку</h1>
    <p class="muted">Введите логин и пароль, выданные администратором.</p>
    <label>Логин
      <input type="text" id="login" name="login" autocomplete="username" required>
    </label>
    <label>Пароль
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="btn btn-primary btn-block">Войти</button>
    <p class="form-error" id="login-error" hidden></p>
  </form>
</section>

<!-- ПАНЕЛЬ -->
<div id="app" class="app" hidden>
  <header class="topbar">
    <h1>Заявки на закупку</h1>
    <div class="topbar-right">
      <input type="search" id="search" class="search" placeholder="Поиск по товару, автору, номеру" autocomplete="off">
      <button class="btn btn-quiet" id="refresh-btn">Обновить</button>
      <button class="theme-toggle" id="theme-toggle" role="switch" aria-label="Тема оформления" title="Светлая или тёмная тема">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path>
        </svg>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
        </svg>
        <span class="theme-knob"></span>
      </button>
      <span class="user" id="user-chip"></span>
      <button class="btn btn-quiet" id="logout-btn">Выйти</button>
    </div>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <main class="content">
    <div class="bulkbar" id="bulkbar" hidden>
      <span class="bulk-count" id="bulk-count"></span>
      <div class="bulk-statuses" id="bulk-statuses"></div>
      <input type="text" id="bulk-comment" class="bulk-comment" placeholder="Комментарий автору (необязательно)">
      <button class="btn btn-danger" id="bulk-delete">Удалить</button>
      <button class="btn btn-quiet" id="bulk-clear">Снять выделение</button>
    </div>

    <table class="requests">
      <thead>
        <tr>
          <th class="col-check"><input type="checkbox" id="check-all" title="Выбрать все"></th>
          <th class="col-num">№</th>
          <th>Товар</th>
          <th class="col-who">Кто заказывает</th>
          <th class="col-qty">Количество</th>
          <th class="col-due">Срок</th>
          <th class="col-status">Статус</th>
          <th class="col-date">Создана</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p class="empty" id="empty" hidden>Заявок пока нет.</p>
  </main>
</div>

<!-- КАРТОЧКА ЗАЯВКИ -->
<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header class="modal-head">
      <h2 id="modal-title">Заявка</h2>
      <button class="icon-btn" id="modal-close" title="Закрыть (Esc)" aria-label="Закрыть">&times;</button>
    </header>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="/static/app.js"></script>
</body>
</html>
